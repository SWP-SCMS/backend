spring.application.name=scms-backend
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=${PROFILE_IMAGES_MAX_BYTES:5242880}
spring.servlet.multipart.max-request-size=${PROFILE_IMAGES_MAX_BYTES:5242880}
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

scms.session-lifecycle-delay-ms=30000
scms.coach-assignment.maximum-member-count=${COACH_MAXIMUM_MEMBER_COUNT:20}
scms.profile-images.directory=${PROFILE_IMAGES_DIRECTORY:./data/profile-images}
scms.profile-images.max-bytes=${PROFILE_IMAGES_MAX_BYTES:5242880}

scms.initial-manager.enabled=${INITIAL_MANAGER_ENABLED:false}
scms.initial-manager.full-name=${INITIAL_MANAGER_FULL_NAME:}
scms.initial-manager.phone=${INITIAL_MANAGER_PHONE:}
scms.initial-manager.email=${INITIAL_MANAGER_EMAIL:}
scms.initial-manager.birth-date=${INITIAL_MANAGER_BIRTH_DATE:}
scms.initial-manager.password=${INITIAL_MANAGER_PASSWORD:}

scms.security.access-token-ttl=15m
scms.security.refresh-token-ttl=7d
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.bank-account-name=${SEPAY_BANK_ACCOUNT_NAME:}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
