spring.application.name=scms-backend
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=${PROFILE_IMAGES_MAX_BYTES:5242880}
spring.servlet.multipart.max-request-size=${PROFILE_IMAGES_MAX_BYTES:5242880}
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

scms.session-lifecycle-delay-ms=30000
scms.coach-assignment.maximum-member-count=${COACH_MAXIMUM_MEMBER_COUNT:20}
scms.profile-images.directory=${PROFILE_IMAGES_DIRECTORY:./data/profile-images}
scms.profile-images.max-bytes=${PROFILE_IMAGES_MAX_BYTES:5242880}

scms.initial-manager.enabled=${INITIAL_MANAGER_ENABLED:false}
scms.initial-manager.full-name=${INITIAL_MANAGER_FULL_NAME:}
scms.initial-manager.phone=${INITIAL_MANAGER_PHONE:}
scms.initial-manager.email=${INITIAL_MANAGER_EMAIL:}
scms.initial-manager.birth-date=${INITIAL_MANAGER_BIRTH_DATE:}
scms.initial-manager.password=${INITIAL_MANAGER_PASSWORD:}

scms.security.access-token-ttl=15m
scms.security.refresh-token-ttl=7d
scms.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
scms.email-verification.registration-ttl=${EMAIL_REGISTRATION_TTL:24h}
scms.email-verification.otp-ttl=${EMAIL_OTP_TTL:10m}
scms.email-verification.resend-cooldown=${EMAIL_OTP_RESEND_COOLDOWN:60s}
scms.email-verification.max-attempts=${EMAIL_OTP_MAX_ATTEMPTS:5}
scms.email-verification.hmac-active-version=${EMAIL_OTP_HMAC_ACTIVE_VERSION:}
scms.email-verification.encryption-active-version=${EMAIL_OTP_ENCRYPTION_ACTIVE_VERSION:}
scms.email-verification.hmac-keys=${EMAIL_OTP_HMAC_KEYS:}
scms.email-verification.encryption-keys=${EMAIL_OTP_ENCRYPTION_KEYS:}
scms.email-verification.rate-limit-key=${EMAIL_VERIFICATION_RATE_LIMIT_KEY:}
scms.email-verification.cookie-secure=${EMAIL_VERIFICATION_COOKIE_SECURE:true}
scms.email-verification.cookie-same-site=${EMAIL_VERIFICATION_COOKIE_SAME_SITE:Lax}
scms.email.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.bank-account-name=${SEPAY_BANK_ACCOUNT_NAME:}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
