spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

scms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Reserved for US01. No JWT component consumes this value in the foundation.
scms.security.jwt-secret=${JWT_SECRET:}
