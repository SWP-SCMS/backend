openapi: 3.1.0
info:
  title: SCMS Receptionist Create Member API
  version: 1.0.0
  description: >-
    Contract for US15. An ACTIVE RECEPTIONIST creates an ACTIVE MEMBER Account and profile.
    The default password is generated internally from the normalized phone number and stored
    only as a BCrypt hash. The response never returns a password or authentication token.
servers:
  - url: /api/v1
paths:
  /reception/members:
    post:
      summary: Create a Member at reception
      operationId: createReceptionMember
      description: >-
        Creates the Account, MemberProfile, and ACCOUNT_CREATED Audit Event atomically. An
        ACCOUNT_CREATED Notification is persisted internally after the main transaction commits;
        notification persistence failure does not roll back the created Member.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
            example:
              fullName: Nguyen Van A
              phone: '0901234567'
              email: member@example.com
              birthDate: '2000-01-01'
              profileImageUrl: null
      responses:
        '201':
          description: Member created; no password, token, or authentication cookie is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMemberResponse'
              example:
                accountId: 8fb245e3-d64e-4c78-9ad4-e3434556856c
                memberId: MB-123
                fullName: Nguyen Van A
                phone: '0901234567'
                email: member@example.com
                birthDate: '2000-01-01'
                role: MEMBER
                status: ACTIVE
        '400':
          description: >-
            VALIDATION_ERROR for invalid accepted fields, or MALFORMED_REQUEST for malformed JSON,
            unknown fields, and client-supplied read-only fields.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >-
            Bearer token is missing, invalid, or expired, or its Account no longer exists with
            ACTIVE status.
        '403':
          description: The authenticated Account is not a RECEPTIONIST
        '409':
          description: >-
            A current Account already uses the email or phone. The code is EMAIL_ALREADY_EXISTS,
            PHONE_ALREADY_EXISTS, or ACCOUNT_IDENTIFIER_ALREADY_EXISTS for an unclassified
            database race.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The JWT must identify an existing ACTIVE RECEPTIONIST through its sub claim. Actor IDs
        are never accepted in the request body.
  schemas:
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required:
        - fullName
        - phone
        - email
        - birthDate
      properties:
        fullName:
          type: string
          maxLength: 200
        phone:
          type: string
          pattern: '^0[0-9]{9}$'
          description: Also becomes the initial password internally after normalization.
        email:
          type: string
          format: email
          maxLength: 320
        birthDate:
          type: string
          format: date
          description: Must not be in the future.
        profileImageUrl:
          type:
            - string
            - 'null'
          description: Optional reference only; US15 does not upload or process images.
    CreateMemberResponse:
      type: object
      additionalProperties: false
      required:
        - accountId
        - memberId
        - fullName
        - phone
        - email
        - birthDate
        - role
        - status
      properties:
        accountId:
          type: string
          format: uuid
        memberId:
          type: string
          pattern: '^MB-[0-9]+$'
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        role:
          type: string
          const: MEMBER
        status:
          type: string
          const: ACTIVE
    ProblemDetail:
      type: object
      required:
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - EMAIL_ALREADY_EXISTS
            - PHONE_ALREADY_EXISTS
            - ACCOUNT_IDENTIFIER_ALREADY_EXISTS
