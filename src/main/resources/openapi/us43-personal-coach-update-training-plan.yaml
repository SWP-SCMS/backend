openapi: "3.1.0"
info:
  title: SCMS – Personal Coach Training Plan Version API
  version: "1.0"
  description: US43 – Personal Coach - Update Training Plan / Version
paths:
  /coach/members/{memberId}/training-plans/{planId}:
    put:
      operationId: updatePersonalTrainingPlan
      summary: Update a Training Plan by appending a new immutable version
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTrainingPlanRequest" }
      responses:
        "200":
          description: Plan metadata updated and a new immutable version appended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPlanResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    UpdateTrainingPlanRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content:
          type: object
          additionalProperties: true
    TrainingPlanResponse:
      type: object
      required:
        - id
        - memberAccountId
        - coachAssignmentId
        - title
        - status
        - createdByAccountId
        - createdAt
        - versionId
        - versionNumber
        - content
      properties:
        id: { type: string, format: uuid }
        memberAccountId: { type: string, format: uuid }
        coachAssignmentId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdByAccountId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        versionId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 2 }
        content:
          type: object
          additionalProperties: true
    ProblemDetail:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - ACTOR_NOT_ACTIVE_COACH
            - PLUS_MEMBERSHIP_REQUIRED
            - COACH_ASSIGNMENT_NOT_FOUND
            - TRAINING_PLAN_NOT_FOUND
            - TRAINING_PLAN_NOT_ACTIVE
            - TRAINING_PLAN_VERSION_NOT_FOUND
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Active Coach role required.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: Assignment or Training Plan not found in the requested scope.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Conflict:
      description: PLUS Membership, plan status, or version state prevents the update.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
