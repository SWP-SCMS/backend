openapi: "3.1.0"
info:
  title: SCMS – Personal Coach Training Plan API
  version: "1.0"
  description: US42 – Personal Coach - Create Training Plan
paths:
  /coach/members/{memberId}/training-plans:
    get:
      operationId: listMemberTrainingPlansForCoach
      summary: List the assigned Member's Training Plans with their current versions
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated Training Plans ordered newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingPlanPageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      operationId: createPersonalTrainingPlan
      summary: Create a Training Plan and its initial immutable version
      description: Requires the TRAINING_PLAN Benefit. A normal create conflicts when the Member already has an ACTIVE plan; replaceActivePlanId and expectedActivePlanVersion confirm an atomic archive-and-replace.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrainingPlanRequest"
      responses:
        "201":
          description: Training Plan created with Version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateTrainingPlanRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          $ref: "#/components/schemas/TrainingPlanContent"
        replaceActivePlanId:
          type: string
          format: uuid
          description: ACTIVE plan to archive atomically. Must be supplied with expectedActivePlanVersion.
        expectedActivePlanVersion:
          type: integer
          minimum: 1
          description: Latest version observed when replacement was confirmed. Must be supplied with replaceActivePlanId.
    TrainingPlanContent:
      type: object
      additionalProperties: false
      properties:
        goal: { type: string, maxLength: 4000 }
        schedule: { type: string, maxLength: 4000 }
        exercises:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 4000 }
    TrainingPlanResponse:
      type: object
      required:
        - id
        - memberAccountId
        - coachAssignmentId
        - title
        - status
        - createdByAccountId
        - createdAt
        - updatedAt
        - versionId
        - versionNumber
        - versionCreatedAt
        - contentSchemaVersion
        - content
      properties:
        id: { type: string, format: uuid }
        memberAccountId: { type: string, format: uuid }
        coachAssignmentId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdByAccountId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versionId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        versionCreatedAt: { type: string, format: date-time }
        contentSchemaVersion: { type: integer, const: 1 }
        content:
          type: object
          description: Known v1 fields are documented by TrainingPlanContent; unknown legacy fields are preserved in responses.
          additionalProperties: true
    TrainingPlanPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/TrainingPlanResponse" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ProblemDetail:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - ACTOR_NOT_ACTIVE_COACH
            - PLUS_MEMBERSHIP_REQUIRED
            - COACH_ASSIGNMENT_NOT_FOUND
            - ACTIVE_TRAINING_PLAN_EXISTS
            - ACTIVE_TRAINING_PLAN_CHANGED
        activePlanId: { type: string, format: uuid }
        activePlanTitle: { type: string }
        currentVersionNumber: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Active Coach role required.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: No active assignment exists for this Coach and Member.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Conflict:
      description: Missing TRAINING_PLAN Benefit, an existing ACTIVE plan, or a stale replacement confirmation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
