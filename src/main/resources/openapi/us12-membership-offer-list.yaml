openapi: 3.1.0
info:
  title: SCMS Membership Offer List API
  version: 1.0.0
  description: >-
    Contract for US12. This contract lists sellable Membership Offers only; offer detail and
    management operations belong to US13 and US14 and are not included here.
servers:
  - url: /api/v1
paths:
  /membership-offers:
    get:
      summary: List active Membership Offers
      operationId: listMembershipOffers
      description: >-
        Public catalogue returning every ACTIVE Membership Offer belonging to an ACTIVE
        Membership Plan, optionally restricted to one Membership Plan. Results are not paginated
        and are sorted by planCode ASC, durationDays ASC, name ASC, then offerId ASC. When no
        offer matches, the response is 200 with an empty JSON array.
      parameters:
        - name: planCode
          in: query
          required: false
          description: Exact uppercase Membership Plan code.
          schema:
            $ref: '#/components/schemas/MembershipPlanCode'
      responses:
        '200':
          description: Active offers in stable order; the array is empty when no offer matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipOfferSummary'
        '400':
          description: planCode is present but does not match the uppercase Plan code format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The signature and expiry are validated, then the Account identified by sub must still
        exist with ACTIVE status.
  schemas:
    MembershipPlanCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,49}$'
      maxLength: 50
    MembershipOfferSummary:
      type: object
      additionalProperties: false
      required:
        - offerId
        - planCode
        - planDisplayName
        - name
        - description
        - priceAmount
        - currencyCode
        - durationDays
        - benefitCodes
        - benefits
        - supportsBooking
        - supportsPersonalCoaching
      properties:
        offerId:
          type: string
          format: uuid
        planCode:
          $ref: '#/components/schemas/MembershipPlanCode'
        planDisplayName:
          type: string
          description: Loaded from membership_plans.display_name.
        name:
          type: string
        description:
          type: string
        priceAmount:
          type: integer
          minimum: 1
          description: Exact numeric(19,0) amount serialized as a JSON number; never floating point.
        currencyCode:
          type: string
          const: VND
        durationDays:
          type: integer
          minimum: 1
        benefitCodes:
          type: array
          items:
            type: string
          description: Effective Plan Benefit codes sorted by code.
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/MembershipBenefitResponse'
        supportsBooking:
          type: boolean
          description: Loaded from membership_plans.supports_booking.
        supportsPersonalCoaching:
          type: boolean
          description: Loaded from membership_plans.supports_personal_coaching.
    MembershipBenefitResponse:
      type: object
      additionalProperties: false
      required: [code, displayName, description, status, displayOrder, groupCode, groupDisplayName, groupDisplayOrder]
      properties:
        code:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        displayOrder:
          type: integer
          minimum: 0
        groupCode:
          type: [string, "null"]
        groupDisplayName:
          type: [string, "null"]
        groupDisplayOrder:
          type: [integer, "null"]
          minimum: 0
    ProblemDetail:
      type: object
      required:
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          const: INVALID_PLAN_CODE
