openapi: 3.1.0
info:
  title: SCMS Manager Scheduling Changes
  version: v4.4
servers:
  - url: /api/v1
paths:
  /manager/rooms/availability:
    get:
      summary: Discover active rooms available for a time interval
      operationId: discoverRoomAvailability
      description: Read-only availability discovery. Session mutations revalidate room constraints transactionally.
      security: [{ bearerAuth: [] }]
      parameters:
        - {name: startTime, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: endTime, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: requestedCapacity, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: excludeSessionId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Active rooms with interval occupancy and availability.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RoomAvailabilityResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /manager/recurring-schedules:
    post:
      summary: Create a recurring schedule with a configurable Session count
      operationId: createRecurringSchedule
      description: Defaults sessionCount to 30 when omitted and validates every occurrence before writing.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecurringScheduleCreateRequest'}}}
      responses:
        '201':
          description: Recurring schedule and all requested Sessions created atomically.
          content: {application/json: {schema: {$ref: '#/components/schemas/RecurringScheduleResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/classes/types:
    get:
      summary: List supported sport class types
      operationId: listSupportedSportClassTypes
      description: Returns values accepted for new and updated classes. Legacy YOGA is intentionally excluded.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Supported class types.
          content: {application/json: {schema: {type: array, items: {type: string, enum: [GROUP, PT_1_1]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /manager/rooms/{roomId}/suspensions:
    get:
      summary: List room suspension intervals
      operationId: listRoomSuspensions
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      responses:
        '200':
          description: Suspension intervals ordered by start time.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RoomSuspensionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Suspend a room for a future interval
      operationId: createRoomSuspension
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomSuspensionCreateRequest'}}}
      responses:
        '201':
          description: Room suspension created.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomSuspensionResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/rooms/{roomId}/suspensions/{suspensionId}:
    patch:
      summary: Extend an active room suspension and resolve newly affected sessions
      operationId: extendRoomSuspension
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
        - {name: suspensionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomSuspensionExtensionRequest'}}}
      responses:
        '200':
          description: Existing room suspension extended after all resolutions are applied atomically.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomSuspensionResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/rooms/{roomId}/impact-preview:
    post:
      summary: Preview sessions affected by room suspension or permanent disable
      operationId: previewRoomImpact
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomImpactPreviewRequest'}}}
      responses:
        '200':
          description: Affected active, future, or in-progress sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomImpactPreviewResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/rooms/{roomId}/impact-apply:
    post:
      summary: Resolve room impacts and apply suspension or permanent disable
      operationId: applyRoomImpact
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomImpactPreviewRequest'}}}
      responses:
        '200':
          description: Updated room after all resolutions have been applied atomically.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/class-sessions:
    get:
      summary: List manager class sessions with schedule filters
      operationId: listManagerClassSessions
      description: Use classId with date and status filters to load a class detail schedule. Date filters use interval overlap semantics; results are ordered by startTime then id.
      security: [{ bearerAuth: [] }]
      parameters:
        - {name: classId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Paged class sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionPageResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /manager/class-sessions/{id}/schedule:
    patch:
      summary: Atomically reschedule a Session and optionally change Coach or Room
      description: Keeps existing Bookings, requires at least 24 hours before the current start, and rejects Member overlap at the new time.
      security: [{ bearerAuth: [] }]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionScheduleRequest'}}}
      responses:
        '200':
          description: Session rescheduled and affected Members notified.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/class-sessions/{id}/assignment:
    patch:
      summary: Change the Coach or Room assigned to a scheduled Session
      operationId: updateClassSessionAssignment
      description: For PT_1_1 Sessions, a Coach change locks active Bookings and Waitlist entries and requires every affected Member to have an ACTIVE assignment with the new Coach.
      security: [{ bearerAuth: [] }]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionAssignmentRequest'}}}
      responses:
        '200':
          description: Session assignment updated.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/class-sessions/{id}/available-coaches:
    get:
      summary: List active Coaches available for the Session interval
      operationId: listAvailableCoachesForSession
      description: Excludes active overlapping Sessions other than the target Session and approved Coach leave intervals. The assignment mutation still revalidates availability.
      security: [{ bearerAuth: [] }]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Available Coaches ordered by full name and account ID.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AvailableCoachResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /manager/class-sessions/cancellation-preview:
    post:
      summary: Preview future scheduled sessions eligible for cancellation
      operationId: previewClassSessionCancellation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationBatchRequest'}}}
      responses:
        '200':
          description: Eligible future session IDs.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationPreviewResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/class-sessions/bulk-cancel:
    post:
      summary: Cancel future scheduled sessions
      operationId: bulkCancelClassSessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationBatchRequest'}}}
      responses:
        '200':
          description: Sessions cancelled with existing booking cancellation, audit, and notification behavior.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationBatchResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    RecurringScheduleCreateRequest:
      type: object
      required: [classId, coachId, roomId, startDate, weekdays, startTime, endTime, capacity]
      properties:
        classId: {type: string, format: uuid}
        coachId: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        startDate: {type: string, format: date}
        weekdays:
          type: array
          uniqueItems: true
          minItems: 1
          items: {type: integer, minimum: 1, maximum: 7}
        startTime: {type: string, format: time}
        endTime: {type: string, format: time}
        capacity: {type: integer, minimum: 1}
        sessionCount: {type: integer, minimum: 1, maximum: 100, default: 30}
    RecurringScheduleResponse:
      type: object
      required: [id, sessionCount, sessionIds]
      properties:
        id: {type: string, format: uuid}
        sessionCount: {type: integer, minimum: 1, maximum: 100}
        sessionIds:
          type: array
          items: {type: string, format: uuid}
    AvailableCoachResponse:
      type: object
      required: [coachAccountId, fullName, phone]
      properties:
        coachAccountId: {type: string, format: uuid}
        fullName: {type: string}
        phone: {type: string}
    ClassSessionScheduleRequest:
      type: object
      required: [startTime, endTime, expectedVersion, reason]
      properties:
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        coachId: {type: [string, 'null'], format: uuid}
        roomId: {type: [string, 'null'], format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    RoomSuspensionCreateRequest:
      type: object
      required: [startTime, endTime]
      properties:
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        reason: {type: [string, 'null'], maxLength: 1000}
    RoomSuspensionExtensionRequest:
      type: object
      description: Provide either resolutions or bulkResolution. Overrides are applied after the bulk template.
      required: [expectedEndTime, endTime, reason]
      properties:
        expectedEndTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        reason: {type: string, maxLength: 1000}
        resolutions:
          type: array
          items: {$ref: '#/components/schemas/RoomSessionResolutionRequest'}
        bulkResolution: {$ref: '#/components/schemas/RoomBulkResolutionRequest'}
        resolutionOverrides:
          type: array
          items: {$ref: '#/components/schemas/RoomSessionResolutionRequest'}
    RoomSuspensionResponse:
      type: object
      required: [id, roomId, startTime, endTime, createdBy]
      properties:
        id: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        reason: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
    RoomImpactPreviewRequest:
      type: object
      description: For apply requests, provide resolutions or a bulkResolution. Overrides are applied after the bulk template.
      properties:
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        permanentDisable: {type: boolean, default: false}
        reason: {type: [string, 'null'], maxLength: 1000}
        resolutions:
          type: array
          items: {$ref: '#/components/schemas/RoomSessionResolutionRequest'}
        bulkResolution: {$ref: '#/components/schemas/RoomBulkResolutionRequest'}
        resolutionOverrides:
          type: array
          items: {$ref: '#/components/schemas/RoomSessionResolutionRequest'}
    RoomBulkResolutionRequest:
      type: object
      description: Template applied to every affected session. RESCHEDULE is only supported through per-session resolutions or overrides.
      required: [action]
      properties:
        action: {type: string, enum: [MOVE, CANCEL]}
        targetRoomId: {type: [string, 'null'], format: uuid}
        reason: {type: [string, 'null'], maxLength: 1000}
    RoomSessionResolutionRequest:
      type: object
      required: [sessionId, action]
      properties:
        sessionId: {type: string, format: uuid}
        action: {type: string, enum: [MOVE, RESCHEDULE, CANCEL]}
        targetRoomId: {type: [string, 'null'], format: uuid}
        startTime: {type: [string, 'null'], format: date-time}
        endTime: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null'], maxLength: 1000}
    RoomImpactPreviewResponse:
      type: object
      required: [count, sessions]
      properties:
        count: {type: integer, minimum: 0}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/RoomImpactSession'}
    RoomImpactSession:
      type: object
      required: [sessionId, classId, className, coachId, roomId, roomName, startTime, endTime, status, bookingCount]
      properties:
        sessionId: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        className: {type: string}
        coachId: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        roomName: {type: string}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        status: {type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]}
        version: {type: integer, format: int64, minimum: 0}
        bookingCount: {type: integer, format: int64, minimum: 0}
    RoomResponse:
      type: object
      required: [id, name, capacity, status, usageMode]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        capacity: {type: integer}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        usageMode: {type: string, enum: [EXCLUSIVE, SHARED]}
    RoomAvailabilityResponse:
      type: object
      required: [roomId, name, usageMode, capacity, occupiedCapacity, availableCapacity, available]
      properties:
        roomId: {type: string, format: uuid}
        name: {type: string}
        usageMode: {type: string, enum: [EXCLUSIVE, SHARED]}
        capacity: {type: integer, minimum: 1}
        occupiedCapacity: {type: integer, format: int64, minimum: 0}
        availableCapacity: {type: integer, format: int64, minimum: 0}
        available: {type: boolean}
    ClassSessionPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ClassSessionResponse'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    ClassSessionAssignmentRequest:
      type: object
      properties:
        coachId: {type: [string, 'null'], format: uuid}
        roomId: {type: [string, 'null'], format: uuid}
      description: At least one of coachId or roomId is required.
    ClassSessionResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        className: {type: string}
        coachId: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        capacity: {type: integer}
        status: {type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]}
    ClassSessionCancellationBatchRequest:
      type: object
      properties:
        sessionIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        classId: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Required by bulk-cancel; optional for preview.}
    ClassSessionCancellationPreviewResponse:
      type: object
      required: [count, sessionIds]
      properties:
        count: {type: integer, minimum: 0}
        sessionIds: {type: array, items: {type: string, format: uuid}}
    ClassSessionCancellationBatchResponse:
      type: object
      required: [cancelledCount, sessionIds]
      properties:
        cancelledCount: {type: integer, minimum: 0}
        sessionIds: {type: array, items: {type: string, format: uuid}}
    SportClassCreateRequest:
      type: object
      required: [disciplineId, name, classType]
      properties:
        disciplineId: {type: string, format: uuid}
        name: {type: string, maxLength: 150}
        classType: {type: string, enum: [GROUP, PT_1_1], description: Only supported values for new classes.}
    SportClassPatchRequest:
      type: object
      properties:
        classType: {type: string, enum: [GROUP, PT_1_1], description: Only supported values for updates.}
        status: {type: string, enum: [ACTIVE, INACTIVE], description: INACTIVE is rejected with CLASS_HAS_ACTIVE_SESSIONS while a SCHEDULED or IN_PROGRESS session has not ended.}
    SportClassResponse:
      type: object
      properties:
        classType: {type: string, enum: [GROUP, PT_1_1, YOGA], description: YOGA is legacy read/history data only and is not accepted for new or updated classes.}
    SchedulingProblem:
      type: object
      properties:
        code: {type: string, example: CLASS_HAS_ACTIVE_SESSIONS}
        affectedSessionIds: {type: array, items: {type: string, format: uuid}}
        affectedBookings:
          type: array
          items: {$ref: '#/components/schemas/PtSessionAffectedBooking'}
        affectedWaitlists:
          type: array
          items: {$ref: '#/components/schemas/PtSessionAffectedWaitlist'}
        affectedSessions:
          type: array
          items:
            type: object
            properties:
              sessionId: {type: string, format: uuid}
              classId: {type: string, format: uuid}
              className: {type: string}
              startTime: {type: string, format: date-time}
              endTime: {type: string, format: date-time}
    PtSessionAffectedBooking:
      type: object
      required: [bookingId, memberAccountId, memberCode, memberFullName]
      properties:
        bookingId: {type: string, format: uuid}
        memberAccountId: {type: string, format: uuid}
        memberCode: {type: string}
        memberFullName: {type: string}
    PtSessionAffectedWaitlist:
      type: object
      required: [waitlistId, memberAccountId, memberCode, memberFullName]
      properties:
        waitlistId: {type: string, format: uuid}
        memberAccountId: {type: string, format: uuid}
        memberCode: {type: string}
        memberFullName: {type: string}
  responses:
    BadRequest: {description: Invalid request.}
    Unauthorized: {description: Authentication required.}
    Forbidden: {description: Manager role required.}
    NotFound: {description: Resource not found.}
    Conflict:
      description: Request conflicts with current scheduling state. PT Coach changes can return PT_SESSION_ASSIGNMENT_HAS_INCOMPATIBLE_MEMBERS with affected Bookings and Waitlists.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/SchedulingProblem'}}}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
