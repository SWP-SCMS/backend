openapi: 3.1.0
info:
  title: SCMS Manager Scheduling Changes
  version: v4.2
servers:
  - url: /api/v1
paths:
  /manager/classes/types:
    get:
      summary: List supported sport class types
      operationId: listSupportedSportClassTypes
      description: Returns values accepted for new and updated classes. Legacy YOGA is intentionally excluded.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Supported class types.
          content: {application/json: {schema: {type: array, items: {type: string, enum: [GROUP, PT_1_1]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /manager/rooms/{roomId}/suspensions:
    get:
      summary: List room suspension intervals
      operationId: listRoomSuspensions
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      responses:
        '200':
          description: Suspension intervals ordered by start time.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RoomSuspensionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Suspend a room for a future interval
      operationId: createRoomSuspension
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomSuspensionCreateRequest'}}}
      responses:
        '201':
          description: Room suspension created.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomSuspensionResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/rooms/{roomId}/impact-preview:
    post:
      summary: Preview sessions affected by room suspension or permanent disable
      operationId: previewRoomImpact
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomImpactPreviewRequest'}}}
      responses:
        '200':
          description: Affected active, future, or in-progress sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomImpactPreviewResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/rooms/{roomId}/impact-apply:
    post:
      summary: Resolve room impacts and apply suspension or permanent disable
      operationId: applyRoomImpact
      security: [{ bearerAuth: [] }]
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomImpactPreviewRequest'}}}
      responses:
        '200':
          description: Updated room after all resolutions have been applied atomically.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/class-sessions:
    get:
      summary: List manager class sessions with schedule filters
      operationId: listManagerClassSessions
      description: Use classId with date and status filters to load a class detail schedule. Date filters use interval overlap semantics; results are ordered by startTime then id.
      security: [{ bearerAuth: [] }]
      parameters:
        - {name: classId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Paged class sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionPageResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /manager/class-sessions/cancellation-preview:
    post:
      summary: Preview future scheduled sessions eligible for cancellation
      operationId: previewClassSessionCancellation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationBatchRequest'}}}
      responses:
        '200':
          description: Eligible future session IDs.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationPreviewResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/class-sessions/bulk-cancel:
    post:
      summary: Cancel future scheduled sessions
      operationId: bulkCancelClassSessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationBatchRequest'}}}
      responses:
        '200':
          description: Sessions cancelled with existing booking cancellation, audit, and notification behavior.
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionCancellationBatchResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    RoomSuspensionCreateRequest:
      type: object
      required: [startTime, endTime]
      properties:
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        reason: {type: [string, 'null'], maxLength: 1000}
    RoomSuspensionResponse:
      type: object
      required: [id, roomId, startTime, endTime, createdBy]
      properties:
        id: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        reason: {type: [string, 'null']}
        createdBy: {type: string, format: uuid}
    RoomImpactPreviewRequest:
      type: object
      properties:
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        permanentDisable: {type: boolean, default: false}
        reason: {type: [string, 'null'], maxLength: 1000}
        resolutions:
          type: array
          items: {$ref: '#/components/schemas/RoomSessionResolutionRequest'}
    RoomSessionResolutionRequest:
      type: object
      required: [sessionId, action]
      properties:
        sessionId: {type: string, format: uuid}
        action: {type: string, enum: [MOVE, RESCHEDULE, CANCEL]}
        targetRoomId: {type: [string, 'null'], format: uuid}
        startTime: {type: [string, 'null'], format: date-time}
        endTime: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null'], maxLength: 1000}
    RoomImpactPreviewResponse:
      type: object
      required: [count, sessions]
      properties:
        count: {type: integer, minimum: 0}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/RoomImpactSession'}
    RoomImpactSession:
      type: object
      required: [sessionId, classId, className, coachId, roomId, roomName, startTime, endTime, status, bookingCount]
      properties:
        sessionId: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        className: {type: string}
        coachId: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        roomName: {type: string}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        status: {type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]}
        bookingCount: {type: integer, format: int64, minimum: 0}
    RoomResponse:
      type: object
      required: [id, name, capacity, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        capacity: {type: integer}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    ClassSessionPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ClassSessionResponse'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    ClassSessionResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        className: {type: string}
        coachId: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        capacity: {type: integer}
        status: {type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]}
    ClassSessionCancellationBatchRequest:
      type: object
      properties:
        sessionIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        classId: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Required by bulk-cancel; optional for preview.}
    ClassSessionCancellationPreviewResponse:
      type: object
      required: [count, sessionIds]
      properties:
        count: {type: integer, minimum: 0}
        sessionIds: {type: array, items: {type: string, format: uuid}}
    ClassSessionCancellationBatchResponse:
      type: object
      required: [cancelledCount, sessionIds]
      properties:
        cancelledCount: {type: integer, minimum: 0}
        sessionIds: {type: array, items: {type: string, format: uuid}}
    SportClassCreateRequest:
      type: object
      required: [disciplineId, name, classType]
      properties:
        disciplineId: {type: string, format: uuid}
        name: {type: string, maxLength: 150}
        classType: {type: string, enum: [GROUP, PT_1_1], description: Only supported values for new classes.}
    SportClassPatchRequest:
      type: object
      properties:
        classType: {type: string, enum: [GROUP, PT_1_1], description: Only supported values for updates.}
    SportClassResponse:
      type: object
      properties:
        classType: {type: string, enum: [GROUP, PT_1_1, YOGA], description: YOGA is retained for legacy reads.}
  responses:
    BadRequest: {description: Invalid request.}
    Unauthorized: {description: Authentication required.}
    Forbidden: {description: Manager role required.}
    NotFound: {description: Resource not found.}
    Conflict: {description: Request conflicts with current scheduling state.}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
