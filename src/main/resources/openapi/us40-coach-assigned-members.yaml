openapi: "3.1.0"
info:
  title: SCMS – Coach Assigned Member API
  version: "1.0"
  description: |
    US40 – Coach - Assigned Member List

    Business rules:
    - BR-COA-03: A Coach may be assigned to multiple Members simultaneously.
    - BR-COA-05: Expired PLUS memberships end the assignment; history remains viewable.
    - BR-COA-06: Only an ACTIVE Coach can access this endpoint.
    - BR-RPT-06: Coach may only see Members within their assigned coaching scope.
    - BR-SEC-04: Role + ownership enforced at backend.

paths:
  /coach/members:
    get:
      operationId: coachListAssignedMembers
      summary: "US40 – List Members currently assigned to the authenticated Coach"
      description: |
        Returns a paginated list of Members who have an ACTIVE Personal Coach Assignment
        with the authenticated Coach. Expired PLUS memberships are reconciled before
        the list is returned (BR-COA-05).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of assigned Members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAssignedMemberPageResponse"
        "400":
          description: Invalid pagination parameters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Authenticated account is not an active Coach.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CoachAssignedMemberSummaryResponse:
      type: object
      required:
        - memberAccountId
        - memberId
        - fullName
        - status
        - assignmentId
        - assignedSince
      properties:
        memberAccountId:
          type: string
          format: uuid
        memberId:
          type: string
          description: System-generated member code (e.g. MBR-000001).
        fullName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        profileImageUrl:
          type: ["string", "null"]
        fitnessGoal:
          type: ["string", "null"]
        assignmentId:
          type: string
          format: uuid
        assignedSince:
          type: string
          format: date-time

    CoachAssignedMemberPageResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CoachAssignedMemberSummaryResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
