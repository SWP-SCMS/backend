openapi: 3.1.0
info: {title: SCMS Session Waitlist, version: v1}
servers: [{url: /api/v1}]
paths:
  /members/class-sessions/{sessionId}/waitlist:
    post: {summary: Join a full Session waitlist, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/SessionId'}], responses: {'201': {$ref: '#/components/responses/Entry'}, '409': {description: Session is not full, duplicate, or booking eligibility failed}}}
    delete: {summary: Leave a Session waitlist, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/SessionId'}], responses: {'200': {$ref: '#/components/responses/Entry'}, '404': {description: Waiting entry not found}}}
  /members/me/waitlists:
    get: {summary: List the Member's waitlist history and current positions, security: [{bearerAuth: []}], responses: {'200': {description: Entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WaitlistResponse'}}}}}}}
  /reception/members/{memberId}/class-sessions/{sessionId}/waitlist:
    post: {summary: Join on behalf of a Member, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/MemberId'}, {$ref: '#/components/parameters/SessionId'}], responses: {'201': {$ref: '#/components/responses/Entry'}}}
    delete: {summary: Leave on behalf of a Member, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/MemberId'}, {$ref: '#/components/parameters/SessionId'}], responses: {'200': {$ref: '#/components/responses/Entry'}}}
  /reception/class-sessions/{sessionId}/waitlist:
    get: {summary: View a Session waitlist, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/SessionId'}], responses: {'200': {description: Entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WaitlistResponse'}}}}}}}
  /manager/class-sessions/{sessionId}/waitlist:
    get: {summary: View a Session waitlist, security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/SessionId'}], responses: {'200': {description: Entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WaitlistResponse'}}}}}}}
components:
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    MemberId: {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    WaitlistResponse:
      type: object
      required: [id, sessionId, memberId, status, source, createdAt]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        status: {type: string, enum: [WAITING, PROMOTED, CANCELLED, SKIPPED, EXPIRED]}
        position: {type: [integer, 'null'], minimum: 1}
        source: {type: string, enum: [MEMBER, RECEPTIONIST]}
        terminalReasonCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        terminalAt: {type: [string, 'null'], format: date-time}
  responses:
    Entry: {description: Waitlist entry, content: {application/json: {schema: {$ref: '#/components/schemas/WaitlistResponse'}}}}
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
