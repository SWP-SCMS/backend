openapi: 3.1.0
info: {title: SCMS Course Refund Obligation API, version: v1}
security: [{bearerAuth: []}]
paths:
  /manager/course-refund-obligations:
    get:
      operationId: listCourseRefundObligations
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/Status'}}
      responses: {'200': {description: Paginated refund workflow queue}, '400': {description: Invalid filter}}
  /manager/course-refund-obligations/{obligationId}:
    get:
      operationId: getCourseRefundObligation
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      responses: {'200': {description: Internal refund obligation detail}, '404': {description: Missing obligation}}
  /manager/course-refund-obligations/{obligationId}/approve:
    post:
      operationId: approveCourseRefundObligation
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses: {'200': {description: Approved obligation}, '409': {$ref: '#/components/responses/Conflict'}}
  /manager/course-refund-obligations/{obligationId}/reject:
    post:
      operationId: rejectCourseRefundObligation
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses: {'200': {description: Rejected obligation}, '409': {$ref: '#/components/responses/Conflict'}}
  /reception/course-refund-obligations/{obligationId}/disburse:
    post:
      operationId: recordCourseRefundDisbursement
      parameters:
        - {$ref: '#/components/parameters/ObligationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/Disbursement'}
      responses:
        '200': {description: Disbursement recorded or replayed}
        '409':
          description: An approved non-immediate refund before Course Run completion uses code COURSE_REFUND_DISBURSEMENT_NOT_ELIGIBLE.
  /reception/course-refunds:
    get:
      operationId: listReceptionCourseRefunds
      description: Returns approved refunds without contact, bank, or evidence data.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: eligible, in: query, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: Paginated Receptionist refund queue
          content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionCourseRefundPage'}}}
        '400': {description: Invalid pagination}
  /reception/course-refunds/{refundId}:
    get:
      operationId: getReceptionCourseRefund
      description: Returns one redacted refund with its disbursement eligibility.
      parameters: [{$ref: '#/components/parameters/RefundId'}]
      responses:
        '200':
          description: Redacted Receptionist refund detail
          content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionCourseRefund'}}}
        '404': {description: Missing refund}
  /manager/course-refund-obligations/{obligationId}/verify:
    post:
      operationId: verifyCourseRefundDisbursement
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody: {$ref: '#/components/requestBodies/Verification'}
      responses: {'200': {description: Final verification completed}, '409': {$ref: '#/components/responses/Conflict'}}
  /manager/course-refund-obligations/{obligationId}/fail:
    post:
      operationId: failCourseRefundObligation
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody: {$ref: '#/components/requestBodies/Terminal'}
      responses: {'200': {description: Obligation marked failed}, '409': {$ref: '#/components/responses/Conflict'}}
  /manager/course-refund-obligations/{obligationId}/return:
    post:
      operationId: returnCourseRefundObligation
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody: {$ref: '#/components/requestBodies/Terminal'}
      responses: {'200': {description: Disbursement marked returned}, '409': {$ref: '#/components/responses/Conflict'}}
  /members/me/course-refund-obligations:
    get:
      operationId: listMyCourseRefundObligations
      description: Returns only the authenticated Member's financial history and excludes evidence and staff identities.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Paginated owned refund history}}
  /members/me/course-refund-obligations/{obligationId}:
    get:
      operationId: getMyCourseRefundObligation
      description: Returns a redacted obligation only when it belongs to the authenticated Member.
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      responses: {'200': {description: Redacted owned refund detail}, '404': {description: Missing or not owned}}
components:
  parameters:
    ObligationId: {name: obligationId, in: path, required: true, schema: {type: string, format: uuid}}
    RefundId: {name: refundId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
  schemas:
    Status:
      type: string
      enum: [PENDING_REVIEW, APPROVED, DISBURSEMENT_RECORDED, PENDING_VERIFICATION, COMPLETED, REJECTED, FAILED, RETURNED]
    Decision:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    Disbursement:
      type: object
      additionalProperties: false
      required: [expectedVersion, amountVnd, method, reference, evidenceReference]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        amountVnd: {type: integer, minimum: 0, maximum: 9999999999999999999}
        method: {type: string, enum: [BANK_TRANSFER, CASH]}
        reference: {type: string, minLength: 1, maxLength: 200}
        evidenceReference: {type: string, minLength: 1, maxLength: 500}
    Verification:
      type: object
      additionalProperties: false
      required: [expectedVersion, amountVnd, disbursementReference, evidenceReference, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        amountVnd: {type: integer, minimum: 0, maximum: 9999999999999999999}
        disbursementReference: {type: string, minLength: 1, maxLength: 200}
        evidenceReference: {type: string, minLength: 1, maxLength: 500}
        reason: {type: string, minLength: 1, maxLength: 1000}
    Terminal:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ReceptionCourseRefund:
      type: object
      additionalProperties: false
      required: [refundId, memberId, memberCode, memberName, courseId, courseCode, courseName, courseRunId,
        runCode, courseRunStatus, source, amount, approvedAt, disbursementEligible, disbursementEligibilityReason]
      properties:
        refundId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        memberCode: {type: [string, 'null']}
        memberName: {type: [string, 'null']}
        courseId: {type: [string, 'null'], format: uuid}
        courseCode: {type: [string, 'null']}
        courseName: {type: [string, 'null']}
        courseRunId: {type: string, format: uuid}
        runCode: {type: [string, 'null']}
        courseRunStatus: {type: [string, 'null']}
        source:
          type: string
          enum: [MEMBER_WITHDRAWAL, COURSE_RUN_CANCELLED, MATERIAL_CHANGE, UNRESOLVED_SESSIONS,
            TRANSFER_CREDIT_EXCESS, PAYMENT_EXCEPTION]
        amount: {type: integer, minimum: 0, maximum: 9999999999999999999}
        approvedAt: {type: [string, 'null'], format: date-time}
        disbursementEligible: {type: boolean}
        disbursementEligibilityReason:
          type: string
          enum: [ELIGIBLE, AWAITING_COURSE_COMPLETION, COURSE_RUN_NOT_FOUND]
    ReceptionCourseRefundPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReceptionCourseRefund'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
  requestBodies:
    Decision: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}}
    Disbursement: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Disbursement'}}}}
    Verification: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Verification'}}}}
    Terminal: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Terminal'}}}}
  responses:
    Conflict: {description: Stale version, invalid transition, idempotency conflict, duplicate disbursement, or evidence mismatch}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
