openapi: 3.1.0
info: {title: SCMS Course Enrollment API, version: v1}
security: [{bearerAuth: []}]
paths:
  /reception/members/{memberId}/course-enrollments:
    get:
      operationId: listReceptionMemberCourseEnrollments
      parameters:
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, required: false, schema: {type: integer, format: int32, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [ACTIVE, TRANSFERRED, COMPLETED, WITHDRAWAL_PENDING, WITHDRAWN]}}
        - {name: withdrawalEligible, in: query, required: false, schema: {type: boolean}}
      responses:
        '200': {description: Current enrollment and withdrawal display data, content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionCourseEnrollmentPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /reception/members/{memberId}/course-enrollments/{enrollmentId}:
    get:
      operationId: getReceptionMemberCourseEnrollment
      parameters:
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: enrollmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Current enrollment and withdrawal display data, content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionCourseEnrollment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/me/course-enrollments:
    get:
      operationId: listMyCourseEnrollments
      responses:
        '200':
          description: The authenticated Member's Course enrollments and ordered schedule.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MemberEnrollment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members/me/course-schedule-changes:
    get:
      operationId: listMyCourseScheduleChanges
      responses:
        '200':
          description: Schedule changes and response state for the authenticated Member's enrollments.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ScheduleChange'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members/me/course-schedule-changes/{responseId}/response:
    post:
      operationId: respondToCourseScheduleChange
      parameters: [{name: responseId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleChangeResponse'}}}
      responses:
        '200':
          description: Recorded or idempotently returned the Member's response.
          content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleChange'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /coach/course-sessions/{sessionId}/roster:
    get:
      operationId: getCourseSessionRoster
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200':
          description: Roster for the CourseSession assigned to the authenticated Coach.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RosterEntry'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /coach/course-sessions/{sessionId}/roster/{enrollmentSessionId}/attendance:
    patch:
      operationId: updateCourseAttendance
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {name: enrollmentSessionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AttendanceUpdate'}}}
      responses:
        '200':
          description: Updated attendance.
          content: {application/json: {schema: {$ref: '#/components/schemas/RosterEntry'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    CourseRunStatus: {type: string, enum: [DRAFT, OPEN_FOR_REGISTRATION, CONFIRMED, IN_PROGRESS, SETTLEMENT_PENDING, COMPLETED, CANCELLED]}
    ReceptionCourseEnrollmentPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ReceptionCourseEnrollment'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    ReceptionCourseEnrollment:
      type: object
      additionalProperties: false
      required: [memberId, memberCode, memberName, courseId, courseCode, courseName, courseRunId, runCode, courseRunStatus, enrollmentId, enrollmentStatus, enrolledAt, totalUnits, remainingUnits, withdrawalEligible, withdrawalReason, estimatedRefundAmount]
      properties:
        memberId: {type: string, format: uuid}
        memberCode: {type: string}
        memberName: {type: string}
        courseId: {type: string, format: uuid}
        courseCode: {type: string}
        courseName: {type: string}
        courseRunId: {type: string, format: uuid}
        runCode: {type: string}
        courseRunStatus: {$ref: '#/components/schemas/CourseRunStatus'}
        enrollmentId: {type: string, format: uuid}
        enrollmentStatus: {type: string, enum: [ACTIVE, TRANSFERRED, COMPLETED, WITHDRAWAL_PENDING, WITHDRAWN]}
        enrolledAt: {type: string, format: date-time}
        totalUnits: {type: integer}
        remainingUnits: {type: integer}
        withdrawalEligible: {type: boolean}
        withdrawalReason: {type: string, enum: [ELIGIBLE_WITH_REFUND, ELIGIBLE_WITHOUT_REFUND, FINAL_UNIT_ALREADY_STARTED, ENROLLMENT_NOT_ACTIVE, COURSE_RUN_NOT_WITHDRAWABLE]}
        estimatedRefundAmount: {type: [integer, 'null'], description: Null when withdrawalEligible is false.}
    AttendanceStatus: {type: string, enum: [NOT_RECORDED, PRESENT, ABSENT]}
    ScheduleChangeResponse:
      type: object
      additionalProperties: false
      required: [response]
      properties: {response: {type: string, enum: [CONTINUE, REQUEST_WITHDRAWAL, REQUEST_TRANSFER]}}
    ScheduleChange:
      type: object
      additionalProperties: false
      required: [id, enrollmentSessionId, oldStartAt, oldEndAt, newStartAt, newEndAt, notificationSentAt, responseDeadline,
        status, cause, withdrawalEligible]
      properties:
        id: {type: string, format: uuid}
        enrollmentSessionId: {type: string, format: uuid}
        oldStartAt: {type: string, format: date-time}
        oldEndAt: {type: string, format: date-time}
        newStartAt: {type: string, format: date-time}
        newEndAt: {type: string, format: date-time}
        notificationSentAt: {type: string, format: date-time}
        responseDeadline: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, RESPONDED, SUPERSEDED]}
        response: {type: [string, 'null'], enum: [CONTINUE, REQUEST_WITHDRAWAL, REQUEST_TRANSFER, null]}
        respondedAt: {type: [string, 'null'], format: date-time}
        changeEventId: {type: [string, 'null'], format: uuid}
        cause: {type: string, enum: [VOLUNTARY, START_DELAY_OVER_7_DAYS, MEMBER_SCHEDULE_CONFLICT, REDUCED_UNIT_COUNT]}
        withdrawalRequestId: {type: [string, 'null'], format: uuid}
        withdrawalEligible: {type: boolean}
        withdrawalReason: {type: [string, 'null']}
        refundBasisVnd: {type: [integer, 'null']}
        refundAmountVnd: {type: [integer, 'null']}
    AttendanceUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {type: string, enum: [PRESENT, ABSENT]}}
    MemberSession:
      type: object
      additionalProperties: false
      required: [enrollmentSessionId, courseSessionId, unitNumber, startAt, endAt, disposition, sessionStatus,
        attendanceStatus, isMakeup, originalSessionId, replacementSessionId]
      properties:
        enrollmentSessionId: {type: string, format: uuid}
        courseSessionId: {type: string, format: uuid}
        unitNumber: {type: integer, minimum: 1}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        disposition: {type: string, enum: [ENROLLED, NOT_ENROLLED]}
        sessionStatus: {$ref: '#/components/schemas/CourseSessionStatus'}
        attendanceStatus: {$ref: '#/components/schemas/AttendanceStatus'}
        attendanceRecordedAt: {type: [string, 'null'], format: date-time}
        isMakeup: {type: boolean}
        originalSessionId: {type: [string, 'null'], format: uuid}
        replacementSessionId: {type: [string, 'null'], format: uuid}
    MemberPaymentSummary:
      type: object
      additionalProperties: false
      required: [amountVnd, status, method]
      properties:
        amountVnd: {type: integer}
        status: {type: [string, 'null'], enum: [PENDING, PAID, FAILED, null]}
        method: {type: [string, 'null'], enum: [SEPAY, CASH, null]}
    MemberEnrollment:
      type: object
      additionalProperties: false
      required: [enrollmentId, courseRunId, courseCode, courseName, runCode, courseRunStatus, lifecycleStatus,
        enrolledAt, payment, sessions]
      properties:
        enrollmentId: {type: string, format: uuid}
        courseRunId: {type: string, format: uuid}
        courseCode: {type: string}
        courseName: {type: string}
        runCode: {type: string}
        courseRunStatus: {$ref: '#/components/schemas/CourseRunStatus'}
        lifecycleStatus: {type: string, enum: [ACTIVE, TRANSFERRED, COMPLETED, WITHDRAWAL_PENDING, WITHDRAWN]}
        enrolledAt: {type: string, format: date-time}
        payment: {$ref: '#/components/schemas/MemberPaymentSummary'}
        sessions: {type: array, items: {$ref: '#/components/schemas/MemberSession'}}
    RosterEntry:
      type: object
      additionalProperties: false
      required: [enrollmentSessionId, memberCode, fullName, attendanceStatus]
      properties:
        enrollmentSessionId: {type: string, format: uuid}
        memberCode: {type: string}
        fullName: {type: string}
        profileImageUrl: {type: [string, 'null']}
        attendanceStatus: {$ref: '#/components/schemas/AttendanceStatus'}
        attendanceRecordedAt: {type: [string, 'null'], format: date-time}
    ApiProblem:
      type: object
      required: [title, status, detail, instance, code]
      properties: {title: {type: string}, status: {type: integer}, detail: {type: string}, instance: {type: string}, code: {type: string}}
  responses:
    BadRequest: {description: Invalid request, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Unauthorized: {description: Authentication required, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Forbidden: {description: Role denied, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    NotFound: {description: Hidden or missing resource, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
    Conflict: {description: Attendance window closed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ApiProblem'}}}}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
