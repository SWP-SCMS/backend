openapi: 3.1.0
info:
  title: SCMS Change Password API
  version: 1.0.0
  description: >-
    Contract for US04 self-service password changes. The Account is selected only from the
    authenticated JWT subject. A successful request terminates the current refresh-token
    session; the frontend must discard its in-memory access token and redirect to Login.
servers:
  - url: /api/v1
paths:
  /auth/change-password:
    post:
      summary: Change the authenticated Account's password
      operationId: changePassword
      description: >-
        Available to ACTIVE MEMBER, RECEPTIONIST, COACH, and MANAGER Accounts. On success the
        password is replaced with a BCrypt hash, the usable refresh token supplied by the
        current refresh_token cookie is revoked, and that cookie is cleared. No replacement
        access or refresh token is issued. Other sessions are not revoked. Because access
        tokens are stateless JWTs with a 15-minute TTL, the frontend must discard its current
        access token and redirect to Login.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and the current refresh-token session terminated; body is empty
          headers:
            Set-Cookie:
              description: >-
                Expired refresh_token cookie with Path=/api/v1/auth and Max-Age=0. No new token
                is returned in a header or response body.
              schema:
                type: string
        '400':
          description: >-
            Stable codes are VALIDATION_ERROR, MALFORMED_REQUEST, CURRENT_PASSWORD_INCORRECT,
            and NEW_PASSWORD_SAME_AS_CURRENT. Password and session state remain unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >-
            Bearer token is missing, invalid, or expired, or its Account no longer exists with
            ACTIVE status.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The JWT subject is the sole source of the Account UUID.
  schemas:
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          description: Not trimmed; whitespace may be part of the password.
        newPassword:
          type: string
          format: password
          minLength: 8
          description: >-
            Not trimmed. Must differ from the current password; equality is checked using the
            password encoder against the stored BCrypt hash.
    ProblemDetail:
      type: object
      required:
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - CURRENT_PASSWORD_INCORRECT
            - NEW_PASSWORD_SAME_AS_CURRENT
            - INVALID_TOKEN
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
