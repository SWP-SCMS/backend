openapi: 3.1.0
info:
  title: SCMS Manager Assignment Discovery
  version: v1
servers:
  - url: /api/v1
paths:
  /manager/coach-assignments/candidates:
    get:
      summary: List assignment-eligible Members
      description: Reconciles due Memberships and Coach assignments before returning ACTIVE Members with an effective PERSONAL_COACHING Benefit.
      operationId: listAssignmentCandidates
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: assignmentStatus
          in: query
          required: false
          schema:
            type: string
            enum: [UNASSIGNED, ASSIGNED, ALL]
            default: ALL
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated assignment candidates, ordered unassigned first and then by Membership expiry, member code, and UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCandidatePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /manager/coaches/assignment-workloads:
    get:
      summary: List active Coach assignment workloads
      description: Reconciles due Memberships and Coach assignments before returning informational active assignment counts for ACTIVE Coaches.
      operationId: listCoachAssignmentWorkloads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active Coaches and their current active Member counts. Availability is informational and does not block assignment mutation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachAssignmentWorkloadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Query, assignmentStatus, page, or size is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Unauthorized:
      description: Bearer token is missing, invalid, expired, or belongs to an inactive account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: The authenticated account is not a Manager.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    AssignmentCandidateResponse:
      type: object
      required: [memberAccountId, memberCode, fullName, phone, email, membershipEndsAt, assignmentStatus]
      additionalProperties: false
      properties:
        memberAccountId: { type: string, format: uuid }
        memberCode: { type: string }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        membershipEndsAt: { type: string, format: date-time }
        assignmentStatus:
          type: string
          enum: [UNASSIGNED, ASSIGNED]
    AssignmentCandidatePageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentCandidateResponse'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CoachAssignmentWorkloadResponse:
      type: object
      required: [coachAccountId, fullName, phone, email, activeMemberCount, maximumMemberCount, availableForAssignment]
      additionalProperties: false
      properties:
        coachAccountId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        activeMemberCount: { type: integer, format: int64, minimum: 0 }
        maximumMemberCount:
          type: [integer, "null"]
        availableForAssignment:
          type: boolean
          const: true
    ApiProblem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        traceId: { type: string }
