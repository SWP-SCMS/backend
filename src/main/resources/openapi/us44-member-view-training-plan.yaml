openapi: "3.1.0"
info:
  title: SCMS - Member Training Plan History API
  version: "1.0"
  description: |
    US44 - Member - View Training Plan.
    The authenticated MEMBER can view only their own Training Plans and every immutable Plan Version.
    Historical Plans remain visible after PLUS Membership expiry or Personal Coach Assignment end.
paths:
  /members/me/training-plans:
    get:
      operationId: memberViewTrainingPlans
      summary: View the authenticated Member's Training Plans and version history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own Training Plans ordered newest first; versions ordered oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberTrainingPlanResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    MemberTrainingPlanResponse:
      type: object
      required:
        - id
        - memberAccountId
        - coachAssignmentId
        - title
        - status
        - createdByAccountId
        - createdAt
        - updatedAt
        - versions
      properties:
        id: { type: string, format: uuid }
        memberAccountId: { type: string, format: uuid }
        coachAssignmentId: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdByAccountId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/MemberTrainingPlanVersionResponse" }
    MemberTrainingPlanVersionResponse:
      type: object
      required: [id, versionNumber, content, createdByAccountId, createdAt]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        content:
          type: object
          additionalProperties: true
        createdByAccountId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ProblemDetail:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Active MEMBER role required.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
