openapi: 3.1.0
info:
  title: SCMS Member Registration API
  version: 1.0.0
  description: >-
    Contract for US02 member self-registration. Registration creates an ACTIVE MEMBER account
    but does not authenticate it and returns no access token, refresh token, or cookie.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Register a member account
      operationId: registerMember
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Member account, profile, audit event, and pending notification were created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  responses:
    BadRequest:
      description: >-
        Request parsing or validation failed. Stable codes are VALIDATION_ERROR and MALFORMED_REQUEST.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: >-
        Email or phone is already used by an account whose status is not INACTIVE. Stable codes are
        EMAIL_ALREADY_EXISTS, PHONE_ALREADY_EXISTS, and ACCOUNT_IDENTIFIER_ALREADY_EXISTS (race fallback).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - fullName
        - phone
        - email
        - password
        - birthDate
      properties:
        fullName:
          type: string
          maxLength: 200
          description: Leading and trailing whitespace is removed; the result must not be blank.
        phone:
          type: string
          pattern: '^0[0-9]{9}$'
          examples:
            - '0901234567'
          description: Canonical Vietnamese phone number stored as 10 digits starting with 0.
        email:
          type: string
          format: email
          maxLength: 320
          description: Leading and trailing whitespace is removed and the value is stored lowercase.
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        birthDate:
          type: string
          format: date
          description: Must not be in the future.
        profileImageUrl:
          type:
            - string
            - 'null'
        fitnessGoal:
          type:
            - string
            - 'null'
    RegistrationResponse:
      type: object
      required:
        - accountId
        - memberId
        - fullName
        - phone
        - email
        - birthDate
        - role
        - status
      properties:
        accountId:
          type: string
          format: uuid
        memberId:
          type: string
          pattern: '^MB-[0-9]+$'
          readOnly: true
          description: System-generated Member ID read from member_profiles.member_code after persistence.
        fullName:
          type: string
        phone:
          type: string
          pattern: '^0[0-9]{9}$'
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        role:
          type: string
          const: MEMBER
        status:
          type: string
          const: ACTIVE
    ProblemDetail:
      type: object
      required:
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
