openapi: 3.1.0
info:
  title: SCMS Staff Self Profile API
  version: 1.0.0
paths:
  /staff/me/profile:
    get:
      summary: Get the authenticated staff profile
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Staff profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffProfileResponse'}
    patch:
      summary: Update the authenticated staff profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffProfilePatchRequest'}
      responses:
        '200':
          description: Updated staff profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffProfileResponse'}
        '409': {description: Email changes require the verified email-change flow}
  /staff/me/profile/image:
    post:
      summary: Upload or replace the authenticated staff profile image
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: 'JPEG or PNG, at most 5 MB'}
      responses:
        '200':
          description: Updated staff profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffProfileResponse'}
  /staff/me/email-change:
    post:
      summary: Start a verified staff email change
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffEmailChangeRequest'}
      responses:
        '202': {description: OTP queued for the new email}
    delete:
      summary: Cancel the pending email change
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Pending request cancelled or already absent}
  /staff/me/email-change/verify:
    post:
      summary: Verify the new email and revoke existing refresh tokens
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffEmailChangeVerifyRequest'}
      responses:
        '200': {description: Email promoted and sessions revoked}
  /staff/me/email-change/resend:
    post:
      summary: Resend the pending email-change OTP
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Replacement OTP queued}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    StaffProfilePatchRequest:
      type: object
      additionalProperties: false
      properties:
        fullName: {type: string, description: 'Allows Unicode letters and combining marks with spaces, hyphens, apostrophes, or periods between name parts.'}
        phone: {type: string}
        birthDate: {type: string, format: date}
    StaffProfileResponse:
      type: object
      required: [accountId, fullName, phone, email, birthDate, role, status, profileImageUrl, pendingEmailChange]
      properties:
        accountId: {type: string, format: uuid}
        fullName: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        birthDate: {type: string, format: date}
        role: {type: string, enum: [MANAGER, RECEPTIONIST, COACH]}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        profileImageUrl: {type: [string, 'null']}
        pendingEmailChange: {type: boolean}
        pendingEmailMasked: {type: [string, 'null']}
        pendingEmailOtpExpiresAt: {type: [string, 'null'], format: date-time}
        pendingEmailResendAvailableAt: {type: [string, 'null'], format: date-time}
    StaffEmailChangeRequest:
      type: object
      additionalProperties: false
      required: [newEmail, currentPassword]
      properties:
        newEmail: {type: string, format: email, maxLength: 320}
        currentPassword: {type: string, format: password}
    StaffEmailChangeVerifyRequest:
      type: object
      additionalProperties: false
      required: [otp]
      properties:
        otp: {type: string, pattern: '^[0-9]{6}$'}
