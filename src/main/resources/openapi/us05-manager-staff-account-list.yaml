openapi: 3.1.0
info:
  title: SCMS Manager Staff Account List
  version: v4.2
servers:
  - url: /api/v1
paths:
  /manager/staff-accounts:
    post:
      summary: Create a staff or manager account
      operationId: createStaffAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, email, birthDate, role]
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                email: { type: string, format: email, maxLength: 320 }
                birthDate: { type: string, format: date }
                role: { type: string, enum: [COACH, RECEPTIONIST, MANAGER] }
      responses:
        '201': { description: Created staff account. }
        '400': { description: Invalid account fields. }
        '401': { description: Missing, invalid or inactive authentication. }
        '403': { description: Authenticated account is not a Manager. }
        '409': { description: Email or phone is already in use. }
    get:
      summary: List and search staff and manager accounts
      operationId: searchStaffAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
          description: Case-insensitive search over full name, email or phone.
        - name: role
          in: query
          schema: { type: string, enum: [COACH, RECEPTIONIST, MANAGER] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Staff accounts visible to the active Manager.
        '400': { description: Invalid filter or pagination parameter. }
        '401': { description: Missing, invalid or inactive authentication. }
        '403': { description: Authenticated account is not a Manager. }
  /manager/staff-accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a staff or manager account
      operationId: getStaffAccount
      security:
        - bearerAuth: []
      responses:
        '200': { description: Staff account details. }
        '401': { description: Missing, invalid or inactive authentication. }
        '403': { description: Authenticated account is not a Manager. }
        '404': { description: Target is not a staff or manager account. }
    patch:
      summary: Update permitted staff or manager account fields
      operationId: updateStaffAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                email: { type: string, format: email, maxLength: 320 }
                birthDate: { type: string, format: date }
      responses:
        '200': { description: Updated staff account. }
        '400': { description: Invalid field or attempted role change. }
        '401': { description: Missing, invalid or inactive authentication. }
        '403': { description: Authenticated account is not a Manager. }
        '404': { description: Target is not a staff or manager account. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
