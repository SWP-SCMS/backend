openapi: 3.1.0
info: {title: SCMS PT 1-1 Booking, version: v1}
servers: [{url: /api/v1}]
paths:
  /members/pt-sessions:
    get:
      summary: List future PT slots belonging to the Member's active Personal Coach
      security: [{bearerAuth: []}]
      responses: {'200': {description: PT catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}}
  /reception/pt-sessions:
    get:
      summary: List all future PT slots for assisted booking
      security: [{bearerAuth: []}]
      responses: {'200': {description: PT catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}}
  /manager/pt-sessions:
    get:
      summary: List all future PT slots
      security: [{bearerAuth: []}]
      responses: {'200': {description: PT catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}}
  /coach/pt-sessions:
    get:
      summary: List all future PT slots
      security: [{bearerAuth: []}]
      responses: {'200': {description: PT catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}}
components:
  schemas:
    SessionPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/PtSession'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    PtSession:
      type: object
      required: [id, classType, coachId, startTime, endTime, capacity]
      properties:
        id: {type: string, format: uuid}
        classType: {type: string, enum: [PT_1_1]}
        coachId: {type: string, format: uuid}
        roomId: {type: [string, 'null'], format: uuid}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        capacity: {type: integer, enum: [1]}
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
