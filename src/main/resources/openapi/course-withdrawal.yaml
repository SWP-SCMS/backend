openapi: 3.1.0
info: {title: SCMS Course Withdrawal API, version: v1}
security: [{bearerAuth: []}]
paths:
  /members/me/course-enrollments/{enrollmentId}/withdrawal-requests:
    post:
      operationId: requestMyCourseWithdrawal
      parameters: [{$ref: '#/components/parameters/EnrollmentId'}]
      requestBody: {$ref: '#/components/requestBodies/Create'}
      responses: {'201': {description: Pending withdrawal request}, '409': {$ref: '#/components/responses/Conflict'}}
  /members/me/course-withdrawal-requests:
    get: {operationId: listMyCourseWithdrawalRequests, responses: {'200': {description: Own withdrawal history}}}
  /members/me/course-withdrawal-requests/{requestId}:
    get:
      operationId: getMyCourseWithdrawalRequest
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Own withdrawal request}, '404': {description: Hidden or missing request}}
  /reception/members/{memberId}/course-enrollments/{enrollmentId}/withdrawal-requests:
    post:
      operationId: requestCourseWithdrawalForMember
      parameters:
        - {$ref: '#/components/parameters/MemberId'}
        - {$ref: '#/components/parameters/EnrollmentId'}
      requestBody: {$ref: '#/components/requestBodies/Create'}
      responses: {'201': {description: Pending withdrawal request}, '409': {$ref: '#/components/responses/Conflict'}}
  /members/me/course-withdrawal-requests/{requestId}/cancel:
    post:
      operationId: cancelMyCourseWithdrawal
      description: Cancel PENDING only; a repeated cancellation returns the saved result. Restore learning without makeup or releasing the seat.
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '200': {description: Cancelled withdrawal, content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalRequest'}}}}
        '400': {description: Invalid reason}
        '401': {description: Authentication required}
        '403': {description: Role or inactive account denied}
        '404': {description: Hidden or missing request}
        '409': {$ref: '#/components/responses/Conflict'}
  /reception/members/{memberId}/course-withdrawal-requests/{requestId}/cancel:
    post:
      operationId: cancelCourseWithdrawalForMember
      description: Cancel PENDING only; a repeated cancellation returns the saved result. Restore learning without makeup or releasing the seat.
      parameters: [{$ref: '#/components/parameters/MemberId'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '200': {description: Cancelled withdrawal, content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalRequest'}}}}
        '400': {description: Invalid reason}
        '401': {description: Authentication required}
        '403': {description: Role or inactive account denied}
        '404': {description: Hidden or missing request}
        '409': {$ref: '#/components/responses/Conflict'}
  /manager/course-withdrawal-requests:
    get: {operationId: listCourseWithdrawalRequests, responses: {'200': {description: Manager withdrawal queue}}}
  /manager/course-withdrawal-requests/{requestId}:
    get:
      operationId: getCourseWithdrawalRequest
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Withdrawal request detail}}
  /manager/course-withdrawal-requests/{requestId}/approve:
    post:
      operationId: approveCourseWithdrawal
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses: {'200': {description: Approved withdrawal with refund snapshot}, '409': {$ref: '#/components/responses/Conflict'}}
  /manager/course-withdrawal-requests/{requestId}/reject:
    post:
      operationId: rejectCourseWithdrawal
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses: {'200': {description: Rejected withdrawal}, '409': {$ref: '#/components/responses/Conflict'}}
  /manager/members/{memberId}/course-enrollments/{enrollmentId}/withdrawal-requests:
    post:
      operationId: requestCourseWithdrawalAsManager
      parameters:
        - {$ref: '#/components/parameters/MemberId'}
        - {$ref: '#/components/parameters/EnrollmentId'}
      requestBody: {$ref: '#/components/requestBodies/Create'}
      responses: {'201': {description: Pending request eligible for self-approval}}
  /reception/members/{memberId}/course-withdrawal-requests:
    get:
      description: Requires active RECEPTIONIST and active beneficiary MEMBER; uses the same ownership, deadline and capacity rules as Member actions.
      parameters:
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Owned result or saved replay, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WithdrawalRequest'}}}}}
        '400': {description: Invalid request}
        '401': {description: Authentication required or inactive account}
        '403': {description: Wrong role}
        '404': {description: Missing or not owned by the beneficiary}
  /reception/members/{memberId}/course-withdrawal-requests/{requestId}:
    get:
      description: Requires active RECEPTIONIST and active beneficiary MEMBER; uses the same ownership, deadline and capacity rules as Member actions.
      parameters:
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Owned result or saved replay, content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalRequest'}}}}
        '400': {description: Invalid request}
        '401': {description: Authentication required or inactive account}
        '403': {description: Wrong role}
        '404': {description: Missing or not owned by the beneficiary}
components:
  parameters:
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    EnrollmentId: {name: enrollmentId, in: path, required: true, schema: {type: string, format: uuid}}
    MemberId: {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    WithdrawalRequest:
      description: New requests contain an immutable request-time snapshot. Legacy records explicitly identify unavailable or approval-time data. estimatedRefundAmount mirrors the saved amount only while the request is pending.
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        enrollmentId: {type: string, format: uuid}
        courseRunId: {type: string, format: uuid}
        memberAccountId: {type: string, format: uuid}
        requesterAccountId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        requestReason: {type: string}
        decisionReason: {type: [string, 'null']}
        requestedAt: {type: string, format: date-time}
        decidedByAccountId: {type: [string, 'null'], format: uuid}
        decidedAt: {type: [string, 'null'], format: date-time}
        totalUnits: {type: [integer, 'null']}
        remainingUnits: {type: [integer, 'null']}
        refundAmountVnd: {type: [integer, 'null']}
        memberId: {type: string, format: uuid}
        memberCode: {type: string}
        memberName: {type: string}
        courseId: {type: string, format: uuid}
        courseCode: {type: string}
        courseName: {type: string}
        runCode: {type: string}
        courseRunStatus: {type: string}
        estimatedRefundAmount: {type: [integer, 'null']}
        cause: {type: string, enum: [VOLUNTARY, START_DELAY_OVER_7_DAYS, MEMBER_SCHEDULE_CONFLICT, REDUCED_UNIT_COUNT, CENTER_SESSION_RESCHEDULE]}
        withdrawalEligible: {type: boolean}
        withdrawalReason: {type: string}
        refundBasisVnd: {type: [integer, 'null']}
        scheduleChangeResponseId: {type: [string, 'null'], format: uuid}
        changeEventId: {type: [string, 'null'], format: uuid}
        snapshotCapturedAt: {type: [string, 'null'], format: date-time}
        snapshotSource: {type: string, enum: [REQUEST_TIME, LEGACY_APPROVAL, UNAVAILABLE]}
        snapshotWithdrawalEligible: {type: [boolean, 'null']}
        snapshotWithdrawalReason: {type: [string, 'null']}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancelledByAccountId: {type: [string, 'null'], format: uuid}
        cancellationReason: {type: [string, 'null']}
        canCancel: {type: boolean}
        learningSuspended: {type: boolean}
        refundObligationId:
          type: [string, 'null']
          format: uuid
          description: Refund obligation linked to this approved withdrawal.
        refundStatus:
          type: [string, 'null']
          enum: [PENDING_REVIEW, APPROVED, DISBURSEMENT_RECORDED, PENDING_VERIFICATION, COMPLETED, REJECTED, FAILED, RETURNED, null]
          description: Current refund progress, independent of the withdrawal decision.
    Create:
      type: object
      additionalProperties: false
      required: [reason]
      properties: {reason: {type: string, minLength: 1, maxLength: 1000}}
    Decision:
      type: object
      additionalProperties: false
      required: [reason]
      properties: {reason: {type: string, minLength: 1, maxLength: 1000}}
  requestBodies:
    Create: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Create'}}}}
    Decision: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}}
  responses:
    Conflict: {description: Withdrawal lifecycle, deadline, or concurrent decision conflict}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
