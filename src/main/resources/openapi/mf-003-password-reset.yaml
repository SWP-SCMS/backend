openapi: 3.1.0
info:
  title: SCMS Forgot Password API
  version: 1.0.0
  description: Public email OTP password reset flow for MF-003.
servers:
  - url: /api/v1
paths:
  /auth/password-reset/request:
    post:
      summary: Request a password reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Always accepted, whether or not an eligible Account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetAcceptedResponse'
        '429':
          description: Request rate limit exceeded
  /auth/password-reset/verify:
    post:
      summary: Verify the latest password reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
      responses:
        '200':
          description: OTP verified and a ten-minute HttpOnly reset session issued
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetVerifiedResponse'
        '400':
          description: Invalid or expired OTP
        '429':
          description: Verification rate limit exceeded
  /auth/password-reset/confirm:
    post:
      summary: Replace the password using the one-time reset session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed, every refresh token revoked, and reset cookie cleared
          headers:
            Set-Cookie:
              schema: {type: string}
        '400':
          description: Password validation failed
        '401':
          description: Reset session is missing, expired, invalid, or already used
components:
  schemas:
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
    PasswordResetAcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted: {type: boolean, const: true}
    PasswordResetVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, otp]
      properties:
        email: {type: string, format: email, maxLength: 320}
        otp: {type: string, pattern: '^[0-9]{6}$'}
    PasswordResetVerifiedResponse:
      type: object
      required: [verified, expiresAt]
      properties:
        verified: {type: boolean, const: true}
        expiresAt: {type: string, format: date-time}
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [newPassword, confirmPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
          description: At most 72 UTF-8 bytes and different from the current password.
        confirmPassword:
          type: string
          format: password
          minLength: 8
          description: Must exactly match newPassword. currentPassword is never accepted.
