openapi: 3.1.0
info:
  title: SCMS Course Order API
  version: 1.0.0
  description: Course orders, SePay payment instructions, receptionist cash fulfillment, and paid enrollment.
servers:
  - url: /api/v1
paths:
  /members/me/course-orders:
    post:
      summary: Create or replay the authenticated Member's course hold
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateCourseOrder' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '201': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /members/me/course-orders/{orderId}:
    get:
      summary: Resume one CourseOrder owned by the authenticated Member
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reception/members/{memberId}/course-orders:
    post:
      summary: Create or replay a course hold for an explicit Member
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MemberId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/CreateCourseOrder' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '201': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reception/members/{memberId}/course-orders/{orderId}:
    get:
      summary: Resume a target Member's CourseOrder at reception
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MemberId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /members/me/course-orders/{orderId}/payments/sepay:
    post:
      summary: Create or resume the authenticated Member's Course QR payment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/CoursePayment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /reception/members/{memberId}/course-orders/{orderId}/payments/sepay:
    post:
      summary: Create or resume a target Member's Course QR payment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MemberId' }
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/CoursePayment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /reception/members/{memberId}/course-orders/{orderId}/payments/cash:
    post:
      summary: Fulfill a target Member's Course order by cash and enroll atomically
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MemberId' }
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/CourseEnrollment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    CreateCourseOrder:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CourseOrderCreateRequest' }
  responses:
    Order:
      description: Current stored order and reservation state; replay never extends expiry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CourseOrderResponse' }
    CoursePayment:
      description: Stable Course payment reference and SePay QR instruction.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CoursePaymentResponse' }
    CourseEnrollment:
      description: Paid Course enrollment created atomically with its unit allocations.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CourseEnrollmentResponse' }
    Problem:
      description: Stable RFC 9457 Problem Details response.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
    Unauthorized:
      description: Authentication failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/UnauthorizedProblem' }
  schemas:
    CourseOrderCreateRequest:
      type: object
      additionalProperties: false
      required: [courseRunId]
      properties:
        courseRunId: { type: string, format: uuid }
    CourseOrderResponse:
      type: object
      additionalProperties: false
      required: [orderId, orderReference, memberId, courseRunId, tuitionVnd, currencyCode,
        orderStatus, reservationStatus, expiresAt, createdAt, payment]
      properties:
        orderId: { type: string, format: uuid }
        orderReference: { type: string, pattern: '^COR-[0-9A-F]{32}$' }
        memberId: { type: string, format: uuid }
        courseRunId: { type: string, format: uuid }
        tuitionVnd: { type: integer, minimum: 1, maximum: 9999999999999999999 }
        currencyCode: { type: string, enum: [VND] }
        orderStatus: { type: string, enum: [PENDING_PAYMENT, EXPIRED, PAID] }
        reservationStatus: { type: string, enum: [HELD, EXPIRED, ENROLLED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        payment: { oneOf: [{ $ref: '#/components/schemas/CoursePaymentResponse' }, { type: 'null' }] }
    CoursePaymentResponse:
      type: object
      additionalProperties: false
      required: [paymentId, orderId, amount, currencyCode, method, paymentReference, bankCode,
        provider, bankAccountNumber, bankAccountName, qrUrl, expiresAt, status]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1, maximum: 9999999999999999999 }
        currencyCode: { type: string, enum: [VND] }
        method: { type: string, enum: [SEPAY, CASH] }
        provider: { type: [string, 'null'], enum: [SEPAY, null] }
        paymentReference: { type: string, pattern: '^COR-[0-9A-F]{32}$' }
        bankCode: { type: [string, 'null'] }
        bankAccountNumber: { type: [string, 'null'] }
        bankAccountName: { type: [string, 'null'] }
        qrUrl: { type: [string, 'null'], format: uri }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, PAID, FAILED] }
    CourseEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollmentId, orderId, memberId, courseRunId, amountPaidVnd, totalUnits, enrolledAt]
      properties:
        enrollmentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        courseRunId: { type: string, format: uuid }
        amountPaidVnd: { type: integer, minimum: 1, maximum: 9999999999999999999 }
        totalUnits: { type: integer, minimum: 1 }
        enrolledAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        affectedSessionIds:
          type: array
          items: { type: string, format: uuid }
        requiredBenefitCodes:
          type: array
          items: { type: string }
        missingBenefitCodes:
          type: array
          items: { type: string }
        affectedSessions:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string, format: uuid }
              classId: { type: string, format: uuid }
              className: { type: string }
              startTime: { type: string, format: date-time }
              endTime: { type: string, format: date-time }
        traceId: { type: string }
    UnauthorizedProblem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum: [UNAUTHENTICATED, INVALID_TOKEN, INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN,
            INVALID_PENDING_SESSION, INVALID_PASSWORD_RESET_SESSION, PAYMENT_UNAUTHORIZED]
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        affectedSessionIds:
          type: array
          items: { type: string, format: uuid }
        requiredBenefitCodes:
          type: array
          items: { type: string }
        missingBenefitCodes:
          type: array
          items: { type: string }
        affectedSessions:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string, format: uuid }
              classId: { type: string, format: uuid }
              className: { type: string }
              startTime: { type: string, format: date-time }
              endTime: { type: string, format: date-time }
        traceId: { type: string }
