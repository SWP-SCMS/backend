openapi: 3.1.0
info:
  title: SCMS Staff Membership History API
  version: 1.0.0
  description: Staff-only membership history contract for API-01.
servers:
  - url: /api/v1
paths:
  /reception/members/{memberCode}/memberships:
    get:
      operationId: getReceptionMemberMemberships
      description: >-
        Requires an active RECEPTIONIST. Resolves an ACTIVE or SUSPENDED Member by MB-* member
        code, reconciles due ACTIVE memberships, and returns stored snapshots with UTC instants.
      security:
        - BearerAuth: []
      parameters:
        - name: memberCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^MB-[0-9]+$'
      responses:
        '200':
          $ref: '#/components/responses/MembershipHistory'
        '401':
          description: Missing, invalid, expired, or inactive staff token
        '403':
          description: Authenticated account is not a RECEPTIONIST
        '404':
          $ref: '#/components/responses/MemberNotFound'
  /manager/members/{memberAccountId}/memberships:
    get:
      operationId: getManagerMemberMemberships
      description: >-
        Requires an active MANAGER. Resolves an ACTIVE or SUSPENDED Member by Account UUID,
        reconciles due ACTIVE memberships, and returns stored snapshots with UTC instants.
      security:
        - BearerAuth: []
      parameters:
        - name: memberAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/MembershipHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, expired, or inactive staff token
        '403':
          description: Authenticated account is not a MANAGER
        '404':
          $ref: '#/components/responses/MemberNotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The memberAccountId path parameter is not a valid UUID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    MembershipHistory:
      description: Memberships owned by the resolved Member, newest first; an empty array is valid
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StaffMembershipResponse'
    MemberNotFound:
      description: Target is missing or is not a Member; code is PAYMENT_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    StaffMembershipResponse:
      type: object
      additionalProperties: false
      required: [membershipId, planCode, offerName, status, startsAt, endsAt, benefitCodes, benefits]
      properties:
        membershipId:
          type: string
          format: uuid
        planCode:
          type: string
          description: Stored membership snapshot, never the current offer
        offerName:
          type: string
          description: Stored membership snapshot, never the current offer
        status:
          type: string
          enum: [RESERVED, ACTIVE, EXPIRED, TERMINATED]
        startsAt:
          type: [string, "null"]
          format: date-time
          description: UTC ISO-8601 instant
        endsAt:
          type: [string, "null"]
          format: date-time
          description: UTC ISO-8601 instant
        benefitCodes:
          type: array
          items:
            type: string
          description: Benefit codes resolved from the immutable Plan code snapshot; empty for unresolved legacy Plans.
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/MembershipBenefitResponse'
    MembershipBenefitResponse:
      type: object
      additionalProperties: false
      required: [code, displayName, description, status, displayOrder, groupCode, groupDisplayName, groupDisplayOrder]
      properties:
        code:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        displayOrder:
          type: integer
          minimum: 0
        groupCode:
          type: [string, "null"]
        groupDisplayName:
          type: [string, "null"]
        groupDisplayOrder:
          type: [integer, "null"]
          minimum: 0
    ApiProblem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
